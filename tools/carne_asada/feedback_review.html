<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARNE ASADA · Stroke review</title>
<style>
:root{font:16px system-ui;color:#20272a;background:#f4f3ed}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:1040px;margin:24px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:4px 0}small,.muted{color:#59656a}section{background:white;border:1px solid #d4d9d5;border-radius:16px;padding:20px;margin:16px 0}video{width:100%;max-height:52vh;background:#171c1b;border-radius:10px}button,input,select,textarea{font:inherit}button{border:1px solid #b7c3bc;border-radius:9px;padding:10px 16px;background:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#265b49;color:white}button[aria-pressed=true]{outline:3px solid #265b49}button.red{color:#a92e2e}button.green{color:#176546}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block}input,select,textarea{width:100%;padding:10px;border:1px solid #b7c3bc;border-radius:8px;margin-top:6px}input[type=checkbox]{width:auto}textarea{min-height:70px}.status{min-height:24px;font-weight:600}a{color:#265b49}@media(max-width:650px){.fields{grid-template-columns:1fr}main{padding:0 12px}header{align-items:start}section{padding:14px}}
</style>
<main>
<header><div><small>CARNE ASADA</small><h1>Review a stroke</h1></div><a href="/api/export" download="coach-feedback.json">Export judgments</a></header>
<p class="muted">Watch the movement, choose one stroke, and record your judgment. You can leave an uncertain stroke unreviewed.</p>
<section><div class="row"><button id="prev">← Previous</button><strong id="position"></strong><button id="next">Next →</button><span id="progress" class="muted"></span></div><p id="source"></p>
<video id="video" controls preload="metadata"></video>
<p class="row"><button id="candidate" disabled>Next detected candidate</button><span id="candidate-status" class="muted"></span></p>
<p class="row"><button id="start">Set stroke start</button><button id="end">Set stroke end</button><span id="span"></span><button id="replay">Replay stroke</button></p></section>
<section><form id="form"><label id="event-field" hidden>Event<select id="event"></select><small>Confirm the event shown in the footage. Springboard analysis is pending.</small></label><div class="fields"><label>Your name<input id="author" autocomplete="name" required></label><label>Attribute<select id="attribute"><option>Slope</option><option>Spacing</option><option>Hinge</option><option>Path</option></select></label></div>
<p>How does this stroke match the coaching reference?</p><div class="row"><button type="button" id="green" class="green" aria-pressed="false">Green · matches</button><button type="button" id="red" class="red" aria-pressed="false">Red · needs work</button></div>
<p><label>Optional explanation<textarea id="notes"></textarea></label></p>
<p><label><input type="checkbox" id="single"> <span id="single-copy">I selected one complete stroke.</span></label></p>
<p><label><input type="checkbox" id="reviewed"> I reviewed the footage and this judgment.</label></p>
<button class="primary" id="save">Save judgment</button> <button type="button" id="another">Another stroke in this clip</button> <span class="status" id="status" role="status" aria-live="polite"></span></form></section>
</main>
<script>
'use strict';let packet,index=0,verdict=null,range=[0,0],candidateIndex=0;const $=id=>document.getElementById(id);
function show(){const t=packet.tasks[index],v=t.feedback;$('position').textContent=`${index+1} of ${packet.tasks.length}`;$('source').textContent=t.display_name;$('prev').disabled=index===0;$('next').disabled=index===packet.tasks.length-1;$('progress').textContent=`${packet.tasks.filter(t=>t.feedback?.reviewed).length} reviewed`;$('video').src=`/media/${encodeURIComponent(t.task_id)}`;range=v?.stroke_span_s?[v.stroke_span_s[0]-t.source_start_s,v.stroke_span_s[1]-t.source_start_s]:[0,t.duration_s];$('author').value=v?.author_id||localStorage.getItem('reviewer')||'';$('attribute').value=v?.attribute||'Slope';$('notes').value=v?.notes||'';$('single').checked=v?.single_stroke_confirmed||false;$('reviewed').checked=v?.reviewed||false;pick(v?.label||null);span();$('status').textContent='';candidateIndex=0;$('candidate').disabled=!(t.candidate_spans_s?.length);$('candidate-status').textContent=t.candidate_spans_s?.length?`${t.candidate_spans_s.length} unreviewed detections · verify bounds`:'';$('event-field').hidden=!t.allowed_event_ids;const options=t.allowed_event_ids||[];$('event').replaceChildren(...options.map(id=>{const o=document.createElement('option');o.value=id;o.textContent=id.replaceAll('_',' ');return o;}));$('event').value=v?.event_id||t.event_hint||options[0]||'';$('single-copy').textContent=t.allowed_event_ids?'I selected one complete stroke and confirmed its event.':'I selected one complete stroke.';}
function span(){$('span').textContent=`${range[0].toFixed(2)}–${range[1].toFixed(2)} seconds`;}
function pick(v){verdict=v;for(const k of ['red','green'])$(k).setAttribute('aria-pressed',String(k===v));}
$('green').onclick=()=>pick('green');$('red').onclick=()=>pick('red');$('prev').onclick=()=>{index--;show();};$('next').onclick=()=>{index++;show();};$('start').onclick=()=>{range[0]=$('video').currentTime;span();};$('end').onclick=()=>{range[1]=$('video').currentTime;span();};$('replay').onclick=()=>{$('video').currentTime=range[0];$('video').play();};$('video').ontimeupdate=()=>{if($('video').currentTime>=range[1])$('video').pause();};
$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='';if(!verdict||!$('single').checked||!$('reviewed').checked||range[1]<=range[0]){$('status').textContent='Choose a judgment and confirm one reviewed stroke.';return;}const t=packet.tasks[index],author=$('author').value.trim();const body={event_id:$('event').value,event_confirmed:$('single').checked,author_id:author,author_role:'coach',reviewer_id:author,attribute:$('attribute').value,label:verdict,notes:$('notes').value,single_stroke_confirmed:true,reviewed:true,stroke_span_s:range.map(x=>x+t.source_start_s)};$('save').disabled=true;try{const res=await fetch(`/api/feedback/${encodeURIComponent(t.task_id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error(data.error);t.feedback=data.feedback;localStorage.setItem('reviewer',author);$('status').textContent='Judgment saved.';$('progress').textContent=`${packet.tasks.filter(t=>t.feedback?.reviewed).length} reviewed`;}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
fetch('/api/tasks').then(r=>r.json()).then(data=>{packet=data;if(packet.tasks.length)show();else $('status').textContent='No review tasks are available.';}).catch(e=>$('status').textContent=e.message);
$('candidate').onclick=()=>{const t=packet.tasks[index],spans=t.candidate_spans_s||[];if(!spans.length)return;const c=spans[candidateIndex++%spans.length];range=c.map(x=>x-t.source_start_s);$('video').currentTime=Math.max(0,range[0]);$('video').pause();$('single').checked=false;$('reviewed').checked=false;pick(null);span();$('status').textContent=`Candidate ${((candidateIndex-1)%spans.length)+1}: verify the person, event and stroke bounds before judging.`;};
setInterval(async()=>{try{const data=await (await fetch('/api/candidates')).json();if(!packet)return;for(const row of data.tasks){const t=packet.tasks.find(t=>t.task_id===row.task_id);if(t)t.candidate_spans_s=row.candidate_spans_s||[];}const t=packet.tasks[index];$('candidate').disabled=!(t?.candidate_spans_s?.length);$('candidate-status').textContent=t?.candidate_spans_s?.length?`${t.candidate_spans_s.length} unreviewed detections · verify bounds`:'';}catch(e){}},30000);
$('another').onclick=async()=>{try{const res=await fetch(`/api/another/${encodeURIComponent(packet.tasks[index].task_id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await res.json();if(!res.ok)throw new Error(data.error);packet.tasks.push(data.task);index=packet.tasks.length-1;show();}catch(e){$('status').textContent=e.message;}};
</script></html>
