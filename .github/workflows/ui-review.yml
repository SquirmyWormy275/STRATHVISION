name: ui-review-evidence
on:
  pull_request:
    branches: [main, implementation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture reviewed source and provenance
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          allowed = {'.dart', '.md', '.yaml', '.yml', '.json', '.py', '.sh', '.lock', '.txt'}
          files = []
          with zipfile.ZipFile('ui-review-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(paths):
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.suffix not in allowed:
                      continue
                  if name.startswith(('docs/experiments/', 'research-data/')):
                      continue
                  data = path.read_bytes()
                  archive.writestr(name, data)
                  files.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
              archive.writestr('UI_SOURCE_MANIFEST.json', json.dumps({
                  'format': 'strathvision-ui-source/1',
                  'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                  'files': files,
                  'scope': 'Text source snapshot. Not a compiled app or device acceptance.'}, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source
          path: ui-review-source.zip
          retention-days: 14
  flutter-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_ui_fonts.py
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.9', cache: true}
      - name: Analyze and render regression candidates
        working-directory: apps/strathvision
        run: |
          flutter pub get
          flutter analyze
          flutter test test/ui_redesign_test.dart test/review_presentation_test.dart test/thumbnail_service_test.dart test/ui_restore_test.dart --reporter expanded --update-goldens --dart-define=CAPTURE_UI=true
      - name: Record screenshot scope and source
        if: always()
        shell: python
        run: |
          import json, pathlib, subprocess
          p = pathlib.Path('apps/strathvision/test/goldens/candidates')
          p.mkdir(parents=True, exist_ok=True)
          (p / 'EVIDENCE.json').write_text(json.dumps({
              'source': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'scope': 'Actual Flutter rendering with deterministic test players; not native video/device acceptance.',
              'golden_status': 'Candidates for visual review, not automatically approved baselines.',
              'private_footage': False,
              'images': sorted(x.name for x in p.glob('*.png'))}, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-ui-screenshot-candidates
          path: |
            apps/strathvision/test/goldens/candidates/
            apps/strathvision/test/failures/**
          if-no-files-found: error
          retention-days: 14
