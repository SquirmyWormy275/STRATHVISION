# Temporary, strictly scoped maintenance for the user-authorized UI branch.
name: ui-integration-repair
on:
  pull_request:
    branches: [implementation]
permissions:
  contents: read
concurrency:
  group: ui-integration-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'SquirmyWormy275/STRATHVISION' && github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/footage-first-ui'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - name: Confirm isolated branch lease
        run: test "$(git ls-remote origin refs/heads/codex/footage-first-ui | cut -f1)" = "$EXPECTED_HEAD"
      - run: python scripts/fetch_ui_fonts.py
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.9', cache: true}
      - name: Apply guarded integration edits
        run: |
          python scripts/ui_integration_repair.py
          python - <<'PY'
          from pathlib import Path
          root = Path('apps/strathvision')
          def change(name, old, new):
              p = root / name
              s = p.read_text()
              assert s.count(old) == 1, 'Unexpected structure: ' + name + ': ' + repr(old[:80])
              p.write_text(s.replace(old, new, 1))
          change('lib/screens/analysis_panel.dart',
              '            )\n          else\n            Row(\n',
              '            ),\n          Row(\n')
          change('test/comparison_test.dart', "find.text('Compare with')", "find.text('Profile')")
          change('lib/screens/workspace_route.dart',
              'final positions = <String, int>{}, signatures = <String, String>{};',
              'final positions = Map<String, int>.of(_saved.positions), signatures = Map<String, String>.of(_saved.signatures);')
          change('lib/screens/workspace_route.dart',
              'if (signature != loaded) continue;',
              'if (signature != loaded) { positions.remove(clip.clipId); signatures.remove(clip.clipId); continue; }')
          change('test/widget_test.dart',
              "  testWidgets('importing the dummy profile lists its metadata',",
              "  testWidgets('canceling Add clip stores no empty review', (tester) async {\n"
              "    await pumpApp(tester);\n"
              "    await tester.tap(find.byKey(const Key('open-workspace')));\n"
              "    await tester.pumpAndSettle();\n"
              "    expect(find.text('Your footage'), findsOneWidget);\n"
              "    expect(await tester.runAsync(() => db.select(db.projectRows).get()), isEmpty);\n"
              "    await unmountApp(tester);\n"
              "  });\n\n"
              "  testWidgets('importing the dummy profile lists its metadata',")
          PY
      - name: Resolve Flutter packages
        working-directory: apps/strathvision
        run: flutter pub get
      - name: Scope-checked Dart formatting and fixes
        shell: python
        run: |
          import subprocess
          allowed = {
            'lib/main.dart', 'lib/design/sv_theme.dart', 'lib/media/thumbnail_service.dart',
            'lib/workspace/review_presentation.dart', 'lib/workspace/stage_player.dart',
            'lib/workspace/workspace_controller.dart', 'lib/analysis/analysis_controller.dart',
            'lib/screens/footage_library_screen.dart', 'lib/screens/workspace_screen.dart',
            'lib/screens/workspace_widgets.dart', 'lib/screens/workspace_route.dart',
            'lib/screens/library_screen.dart', 'lib/screens/analysis_panel.dart',
            'test/widget_test.dart', 'test/workspace_screen_test.dart', 'test/analysis_test.dart',
            'test/packs_test.dart', 'test/comparison_test.dart', 'test/ui_redesign_test.dart',
            'test/thumbnail_service_test.dart', 'test/review_presentation_test.dart',
            'integration_test/app_e2e_test.dart'
          }
          paths = ['apps/strathvision/' + p for p in sorted(allowed)]
          for _ in range(2):
              subprocess.run(['dart', 'format', *paths], check=True)
              subprocess.run(['dart', 'fix', '--apply'], cwd='apps/strathvision', check=True)
          subprocess.run(['dart', 'format', *paths], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          unexpected = [p for p in changed if p and p not in paths]
          if unexpected:
              raise SystemExit('Refusing unrelated changes: ' + repr(unexpected))
      - name: Analyze before publishing repairs
        id: compile
        working-directory: apps/strathvision
        run: flutter analyze
      - name: Commit only scoped repairs, without force
        run: |
          test "$(git ls-remote origin refs/heads/codex/footage-first-ui | cut -f1)" = "$EXPECTED_HEAD"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): reconcile explicit review context and baseline workflows; format Flutter sources'
            git push origin HEAD:refs/heads/codex/footage-first-ui
          fi
      - name: Rendered UI and focused regressions
        working-directory: apps/strathvision
        run: flutter test test/ui_redesign_test.dart test/review_presentation_test.dart test/thumbnail_service_test.dart --reporter expanded --update-goldens --dart-define=CAPTURE_UI=true
      - name: Complete app regression suite
        if: always() && steps.compile.outcome == 'success'
        working-directory: apps/strathvision
        run: flutter test --reporter expanded
      - name: Capture repair source provenance
        if: always()
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          records = []
          with zipfile.ZipFile('ui-repair-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p = pathlib.Path(name)
                  if not name or not p.is_file() or p.suffix not in {'.dart','.md','.py','.yml','.yaml','.lock','.txt'}:
                      continue
                  if name.startswith(('docs/experiments/', 'research-data/')):
                      continue
                  data = p.read_bytes(); z.writestr(name, data)
                  records.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest()})
              z.writestr('UI_SOURCE_MANIFEST.json', json.dumps({
                  'commit': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
                  'worktree_changed': bool(subprocess.check_output(['git','diff','--name-only']).strip()),
                  'files': records}, indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-ui-repair-evidence
          path: |
            ui-repair-source.zip
            apps/strathvision/test/goldens/candidates/*.png
            apps/strathvision/test/failures/**
          if-no-files-found: error
          retention-days: 14
